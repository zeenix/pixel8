# Run the test suite, rustfmt, and clippy on every push to main and on
# pull requests, so formatting and lints stay green before merge.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # .rustfmt.toml uses nightly-only options (wrap_comments,
      # imports_granularity), so formatting runs on nightly.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Check formatting of the example carts
        run: |
          fail=0
          for d in examples/*/; do
            [ -f "$d/Cargo.toml" ] || continue
            echo "::group::fmt $d"
            (cd "$d" && cargo fmt --all -- --check) || fail=1
            echo "::endgroup::"
          done
          exit $fail

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # ALSA headers for the cpal audio used by the console and the windowed player.
      - name: Install ALSA headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p pixel8-player --no-default-features --features kms --all-targets -- -D warnings
      # The SDK's effect features are off by default, so the workspace run above
      # never sees them. Once with all of them and the tests, then each family on
      # its own the way a cart links the SDK: `no_std`, one feature on. (The
      # library only — the SDK's own tests need `std`.)
      - run: cargo clippy -p pixel8 --all-features --all-targets -- -D warnings
      - run: cargo clippy -p pixel8 --no-default-features --features plume-effects -- -D warnings
      - run: cargo clippy -p pixel8 --no-default-features --features physics -- -D warnings
      - name: Clippy the example carts
        run: |
          fail=0
          for d in examples/*/; do
            [ -f "$d/Cargo.toml" ] || continue
            echo "::group::clippy $d"
            (cd "$d" && cargo clippy -- -D warnings) || fail=1
            echo "::endgroup::"
          done
          exit $fail

  test:
    runs-on: ubuntu-latest
    # A backstop: the framebuffer tests fail a runaway draw on their own deadline,
    # but a hang anywhere else would otherwise sit on a runner for GitHub's default
    # six hours before anyone hears about it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The cart-build tests run `cargo build --target
      # wasm32-unknown-unknown`, so that target's std must be present.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # ALSA headers for the cpal audio used by the console and the windowed player.
      - name: Install ALSA headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - run: cargo test --workspace
      - run: cargo test -p pixel8-player --no-default-features --features kms
      # Feature-gated SDK code, including its doc examples, is skipped by the
      # workspace run above. Once with all the families on, then each on its own
      # the way a cart links it: a family's docs and doctests may only mention
      # what its own feature brings in, and the all-features run cannot see that.
      # (`std` stays on — the SDK's own tests need it.)
      - run: cargo test -p pixel8 --all-features
      - run: cargo test -p pixel8 --features plume-effects
      - run: cargo test -p pixel8 --features physics
      # The two published library crates must stay packageable — and buildable
      # from their packages, which is what verification proves. Together, so the
      # runtime's dependency on the SDK resolves against the packaged copy
      # rather than whatever version crates.io last saw.
      - run: cargo package -p pixel8 -p pixel8-runtime

  book:
    runs-on: ubuntu-latest
    # The tutorial book deploys to GitHub Pages from main
    # (.github/workflows/deploy-site.yml); build it here so a broken book
    # is caught before merge.
    steps:
      - uses: actions/checkout@v4
      - name: Install latest mdbook
        run: |
          tag=$(curl -sS 'https://api.github.com/repos/rust-lang/mdbook/releases/latest' | jq -r '.tag_name')
          url="https://github.com/rust-lang/mdbook/releases/download/${tag}/mdbook-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir mdbook
          curl -sSL "$url" | tar -xz --directory=./mdbook
          echo "$(pwd)/mdbook" >> "$GITHUB_PATH"
      - run: mdbook build book

  doc:
    runs-on: ubuntu-latest
    # Fail on any rustdoc warning (e.g. a broken intra-doc link) so the SDK and
    # runtime documentation stays clean.
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # pixel8-runtime's default `audio` feature links ALSA via cpal, so its docs
      # need the headers just like the clippy and test jobs.
      - name: Install ALSA headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      # --no-deps keeps the gate on our own docs: a noisy dependency must not
      # trip -D warnings.
      - run: cargo doc --no-deps --all-features -p pixel8
      # And each SDK effect family on its own, as docs.rs never builds it but a
      # cart does: a link into a family that is off then resolves to nothing, and
      # only a single-feature build sees it.
      - run: cargo doc --no-deps -p pixel8 --features plume-effects
      - run: cargo doc --no-deps -p pixel8 --features physics
      - run: cargo doc --no-deps --all-features -p pixel8-runtime
