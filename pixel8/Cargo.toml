[package]
name = "pixel8"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pixel8 fantasy console SDK: write carts in Rust, compile to wasm32-unknown-unknown"
readme = "README.md"

[features]
default = ["std"]
# When disabled the SDK is `#![no_std]` and provides a panic handler, so carts
# can be allocation-free with `heapless`. Enabled by default; do-nothing carts
# stay on `std`.
std = []
# Ready-made particle effects (`Fire`, `SmokingFire`, `Smoke`, `Explosion`).
# Off by default because it is what pulls in the SDK's only dependency: the
# fixed-capacity buffers the effects hold their particles in. Future effect
# families get their own feature, so a cart only ever links the ones it asks for.
plume-effects = ["dep:heapless"]
# Gravity, wind, collision (against the map's tiles, against the scene's other
# moving matter, and between entities) and the force fields carts write
# themselves (`physics`). Off by default like every other family, and
# dependency-free: the `World` owns its cast in a fixed array of its own, so
# there is nothing here for a vector crate to hold.
physics = []

# Dependency-free unless an effect feature asks for something: a cart building
# for wasm32-unknown-unknown links this crate and, by default, nothing else.
[dependencies]
heapless = { workspace = true, optional = true }

# Tests only (carts never see dev-dependencies): pins the SDK's stack-buffer
# JSON codec against the host's serde_json canonicalization.
[dev-dependencies]
serde_json.workspace = true

# Effects are feature-gated, so docs.rs must build them all to document them.
[package.metadata.docs.rs]
all-features = true
